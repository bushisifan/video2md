[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video2md"
version = "0.1.0"
description = "纯本地视频转SOP工具：已有屏幕录屏 → 带截图的Markdown步骤文档 + Mermaid流程图"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
video2md = "video2md.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["video2md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
